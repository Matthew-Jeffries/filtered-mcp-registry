name: Validate & deploy MCP registry

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to Azure
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Check every approved server exists upstream
        run: python app.py --check

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Mask deployment hostname
        env:
          WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          WEBAPP_HOSTNAME: ${{ secrets.AZURE_WEBAPP_HOSTNAME }}
        run: |
          if [[ -z "$WEBAPP_NAME" || ! "$WEBAPP_HOSTNAME" =~ ^[a-zA-Z0-9.-]+$ ]]; then
            echo "::error::Set AZURE_WEBAPP_NAME and AZURE_WEBAPP_HOSTNAME secrets (hostname only, without scheme or path)."
            exit 1
          fi
          echo "::add-mask::$WEBAPP_HOSTNAME"
      - name: Package
        run: zip -r app.zip app.py registry.yaml requirements.txt static
      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3.0.8
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: app.zip
